name: Status labels

# status:ready ou status:blocked sur chaque ticket ouvert hors epic, design, needs-design, Inbox et
# tâche humaine, selon ses bloqueurs ouverts, et colonne Prêts ou Bloqués du Project. Jamais de
# première étiquette sur un ticket encore en Cadrage : scripts/sync-status-labels.sh.
# Chaque passage recalcule tous les tickets : un événement manqué est rattrapé au suivant.
on:
  # Pas d'événement de workflow pour l'ajout ou le retrait d'une dépendance : la fermeture d'un
  # bloqueur passe par « closed », le reste par le passage de nuit ou un lancement manuel.
  issues:
    types: [closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simuler, sans rien écrire (journal dans le résumé du job)
        type: boolean
        default: false

# Labels écrits avec GITHUB_TOKEN : ils ne relancent pas ce workflow.
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: status-labels
  cancel-in-progress: false

jobs:
  sync:
    name: Sync status labels
    # Seuls ces labels changent le résultat ; les autres (prio, area…) ne relancent rien.
    if: >-
      github.event_name != 'issues'
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || contains(fromJSON('["status:ready", "status:blocked", "type:epic", "type:design", "needs-design", "inbox", "human"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Jeton du Project : le secret PROJECT_TOKEN s'il existe, sinon TOKENS_SYNC_TOKEN, le jeton
      # d'Ilan « widoo-sync-tokens », qui porte aussi Projects en lecture et écriture sur
      # l'organisation et Issues en lecture sur widoo-app. Colonnes lues et rangées. Sans jeton :
      # labels déjà posés seuls, et un ticket en développement n'est reconnu qu'à sa branche
      # issue/N-… ou à sa PR ouverte. Le script ne s'en sert que pour les appels gh project.
      - name: Sync labels and columns
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.TOKENS_SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: scripts/sync-status-labels.sh
