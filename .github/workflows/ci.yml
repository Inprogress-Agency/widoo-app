name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: widoo
          POSTGRES_PASSWORD: widoo
          POSTGRES_DB: widoo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U widoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://widoo:widoo@localhost:5432/widoo_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Le check « Lint, types, tests » est requis pour merger. Il reste vert, en le
      # disant, tant que le socle n'existe pas (pas de package.json) ou quand la PR ne
      # touche que la documentation et le process : évite de contourner le ruleset.
      - name: Detect code to verify
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pas de package.json à la racine : rien à vérifier tant que le socle (#16) n'est pas livré."
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
            code=$(git diff --name-only "$BASE" "$HEAD" \
              | grep -vE '(^|/)[^/]+\.md$|^docs/|^\.claude/|^\.github/|^scripts/[^/]+\.sh$' || true)
            if [ -z "$code" ]; then
              echo "has_code=false" >> "$GITHUB_OUTPUT"
              echo "::notice::PR de documentation ou de process uniquement : lint, types et tests non exécutés."
              exit 0
            fi
            # Thème ou tokens.json touchés : un écart avec le wiki y reste bloquant (#139).
            if grep -qE '^packages/tokens/|^apps/mobile/(tailwind\.config\.[cm]?js|global\.css)$' <<< "$code"; then
              echo "touches_tokens=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "has_code=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.has_code == 'true'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_code == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm install --frozen-lockfile

      # Copie de tokens.json et wiki (#139) : un écart est un avertissement, que la PR ouverte par
      # sync-tokens.yml résorbe ; il ne bloque que les PR qui touchent le thème ou tokens.json.
      - name: Check design tokens against the wiki
        if: steps.detect.outputs.has_code == 'true'
        env:
          TOUCHES_TOKENS: ${{ steps.detect.outputs.touches_tokens }}
        run: |
          if pnpm --filter @widoo/tokens check:wiki; then exit 0; fi
          if [ "$TOUCHES_TOKENS" = "true" ]; then
            echo "::error::tokens.json diffère du wiki et cette PR touche le thème : pnpm --filter @widoo/tokens sync, puis generate."
            exit 1
          fi
          echo "::warning::tokens.json diffère du wiki. La PR « chore(tokens) » ouverte par sync-tokens.yml le synchronise ; cette PR n'est pas bloquée."

      # Preset et thème régénérés à jour avec la copie de tokens.json (#125) : toujours bloquant.
      - name: Check generated theme
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm --filter @widoo/tokens check:generated

      - name: Lint
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm typecheck

      - name: Migrate test database
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm --filter api db:migrate

      - name: Test
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm test -- --coverage

      - name: Build API and admin
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm --filter api --filter admin build

      - name: Audit dependencies
        if: steps.detect.outputs.has_code == 'true'
        run: pnpm audit --audit-level=high
