name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: Title, body, issue link
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|polish|test|docs)\((mobile|api|admin|orchestration|shared|infra|process)\): .{3,}$'; then
            echo "::error::Titre attendu : <type>(<scope>): <action>. Types : feat fix chore polish test docs. Scopes : mobile api admin orchestration shared infra process."
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::Titre de ${#TITLE} caractères, maximum 72."
            exit 1
          fi

      - name: Validate body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Les commentaires HTML du modèle sont invisibles : un lien ou un niveau qui n'y
          # figure qu'en commentaire ne compte pas.
          body=$(printf '%s' "$BODY" | perl -0777 -pe 's/<!--.*?-->//gs')
          fail=0
          for section in '## Résultat et problème' '## Comment vérifier' '## Risque' '## Retour arrière'; do
            grep -qF "$section" <<< "$body" || { echo "::error::Section manquante : $section"; fail=1; }
          done
          grep -qE '(Fixes|Closes|Refs) #[0-9]+' <<< "$body" || { echo "::error::Lien d'issue manquant (Fixes #N, ou Refs #N pour une PR de process sans ticket à fermer)."; fail=1; }
          grep -qE '^Niveau *: *[123]' <<< "$body" || { echo "::error::Niveau de risque manquant (Niveau : 1, 2 ou 3)."; fail=1; }
          grep -qE '^Formatage mécanique *: *(oui|non)' <<< "$body" || { echo "::error::Ligne « Formatage mécanique : oui|non » manquante."; fail=1; }
          exit $fail

  # Ici plutôt que dans CI : le job se relance quand le corps (ligne « Taille : ») ou la base
  # de la PR change, pas seulement à chaque push. Relancer un run ne relit pas le corps modifié.
  diff-size:
    name: Diff size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Measure useful diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          lines=$(git diff --numstat "$BASE" "$HEAD" -- . \
            ':!pnpm-lock.yaml' ':!**/*.snap' ':!**/generated/**' ':!**/*.svg' ':!**/*.png' \
            | awk '{ a += $1; d += $2 } END { print a + d }')
          echo "Useful diff: $lines lines"
          if [ "$lines" -gt 500 ]; then
            echo "::error::Diff de $lines lignes utiles, plafond 500. Redécouper la PR."
            exit 1
          fi
          # Le commentaire du modèle sur la ligne « Taille : » ne vaut pas justification.
          body=$(printf '%s' "$BODY" | perl -0777 -pe 's/<!--.*?-->//gs')
          if [ "$lines" -gt 400 ] && ! grep -qE '^Taille *:.*[A-Za-z]' <<< "$body"; then
            echo "::error::Diff de $lines lignes (> 400) sans justification dans la section Taille du corps de PR."
            exit 1
          fi
