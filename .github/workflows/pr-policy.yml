name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    name: Title, body, issue link
    # ubuntu-latest passe à Ubuntu 26 (actions/runner-images#14748) : épinglé sur 24.04, à remonter
    # à ubuntu-26.04 après une CI et un déploiement staging verts dessus.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Le script est vérifié avant de juger la PR, comme diff-size.sh : une exemption qui
      # s'élargit (autre auteur que dependabot[bot], corps d'une PR humaine) fait échouer le check.
      - name: Test the policy script
        run: bash .github/scripts/pr-policy.test.sh

      # Exemption de Dependabot fondée sur l'auteur de la PR, jamais sur la branche (#555).
      - name: Validate title and body
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash .github/scripts/pr-policy.sh

  # Ici plutôt que dans CI : le job se relance quand le corps (ligne « Taille : ») ou la base
  # de la PR change, pas seulement à chaque push. Relancer un run ne relit pas le corps modifié.
  # Mesure par commit (CLAUDE.md › CODE) ; le script est sous .github/ pour rester sous CODEOWNERS.
  diff-size:
    name: Diff size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Le script est vérifié avant de mesurer : un motif d'exclusion qui s'élargit fait échouer le check.
      - name: Test the measure script
        run: bash .github/scripts/diff-size.test.sh

      - name: Measure useful diff per commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/diff-size.sh "$BASE" "$HEAD"
